<style>
  :root {
    --bg: #070b07;
    --bg2: #0d140d;
    --card: #121a12;
    --line: #1f2c1f;
    --neon: #8FFF00;
    --neon-dim: #5da300;
    --text: #eaf5e0;
    --sub: #8fa38a;
    --red: #ff5c5c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    overscroll-behavior: none;
  }
  #app {
    max-width: 440px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(ellipse 80% 40% at 50% -5%, rgba(143,255,0,.07), transparent),
      var(--bg);
  }

  /* ── header ── */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 18px 10px;
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(var(--bg) 70%, transparent);
  }
  header .back {
    width: 38px; height: 38px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card);
    color: var(--text); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex: none;
  }
  header .htitle { font-size: 17px; font-weight: 800; flex: 1; letter-spacing: -.3px; }
  header .secret {
    width: 38px; height: 38px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card);
    color: var(--sub); font-size: 16px; cursor: pointer; flex: none;
  }

  main { flex: 1; padding: 6px 18px calc(30px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; }

  /* ── home ── */
  .hero { text-align: center; padding: 26px 0 20px; }
  /* 하우스 마크 — 말풍선과 스파크. 서비스마다 로고를 새로 그리지 않는다 (DESIGN.md §7).
     정본은 kyulolong-site 의 public/brand/mark-on-dark.svg 다. 제목 글자 옆에 서므로
     말풍선이 글자와 같은 밝은 색인 on-dark 변형을 쓴다 — 마크가 다른 색이면 제목과
     한 덩어리로 안 읽힌다. 마크가 바뀌면 여기도 같이 갈아야 한다. */
  .hero h1 .dot {
    display: inline-block; width: 26px; height: 26px; margin-right: 10px;
    vertical-align: -3px;
    background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='463 238 1043 1043' fill='none'><path d='M1246 1159C1225 1127 1196.5 1082 1192.5 1058.5C1192.5 1048.45 1195.23 1041 1209.5 1019C1288 898 1276 800 1240 694.5C1235.39 681 1225.5 677.134 1209 688C1190.23 700.36 1167.04 714.735 1131 740C1122 746.31 1117.5 753.5 1120 763.5C1159.5 875.931 1091.66 984.722 993.5 1036.92C889.103 1092.44 743 1075 670 947.776C596 805 657.681 686.49 753 627.997C854.896 565.468 993.5 578.5 1085 692C1091.87 700.523 1096.5 704.485 1106 699L1196.5 641.5C1205 636.5 1202.6 630 1196.5 621C1037.5 386.5 776.404 412.051 628 549C498.441 668.558 467 877 549.5 1011.5C702.279 1260.58 959 1208 1036.5 1163.41C1060.54 1149.58 1076.48 1159.2 1090.5 1163.41C1159 1184 1223.67 1221.5 1246 1200.5C1262.84 1184.66 1253.72 1170.76 1246.21 1159.32L1246 1159Z' fill='%23edebf5'/><circle cx='1338' cy='717' r='52.6968' fill='%238FFF00'/><path d='M1247.29 591.69C1247.13 618.028 1268.35 639.508 1294.69 639.667C1305.71 639.734 1315.89 636.055 1324 629.824L1454.5 502C1463 493.5 1477.5 463 1451.5 437C1430.7 416.2 1404.5 420.5 1391.5 430.5L1259.6 560C1252.01 568.388 1247.36 579.49 1247.29 591.69Z' fill='%238FFF00'/><path d='M1196.79 531.901C1224.85 532.071 1247.73 509.466 1247.9 481.411L1247.9 359C1245.29 344 1231.43 314 1196.79 314C1162.16 314 1148.7 344 1146.3 359L1146.3 480.797C1146.13 508.852 1168.74 531.732 1196.79 531.901Z' fill='%238FFF00'/></svg>") no-repeat center / contain;
  }
  .hero .hat { font-size: 52px; filter: drop-shadow(0 0 24px rgba(143,255,0,.45)); }
  .hero h1 { font-size: 27px; font-weight: 900; letter-spacing: -0.5px; margin-top: 8px; }
  .hero h1 em { font-style: normal; color: var(--neon); text-shadow: 0 0 18px rgba(143,255,0,.5); }
  .hero p { color: var(--sub); font-size: 13.5px; margin-top: 7px; line-height: 1.5; }
  .tricklist { display: flex; flex-direction: column; gap: 10px; }
  .tcard {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 14px 16px; cursor: pointer;
    transition: transform .08s ease, border-color .2s;
    text-align: left; width: 100%; color: var(--text);
  }
  .tcard:active { transform: scale(.975); border-color: var(--neon-dim); }
  .tcard .em { font-size: 30px; flex: none; width: 44px; text-align: center; }
  .tcard .info { flex: 1; min-width: 0; }
  .tcard .name { font-size: 15.5px; font-weight: 800; }
  .tcard .desc { font-size: 12.5px; color: var(--sub); margin-top: 3px; line-height: 1.45; }
  .tag {
    display: inline-block; font-size: 10.5px; font-weight: 700;
    padding: 2.5px 8px; border-radius: 999px; margin-left: 7px; vertical-align: 2px;
  }
  .tag.group { background: rgba(143,255,0,.13); color: var(--neon); }
  .tag.pass  { background: rgba(255,179,92,.14); color: #ffbe73; }

  /* ── shared components ── */
  .stage { flex: 1; display: flex; flex-direction: column; animation: fadein .35s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .ment {
    border: 1px solid rgba(143,255,0,.35);
    background: rgba(143,255,0,.06);
    border-radius: 14px; padding: 12px 14px; margin: 10px 0 16px;
    font-size: 14.5px; line-height: 1.65;
  }
  .ment b { color: var(--neon); }
  .ment .mic { font-size: 11px; font-weight: 800; color: var(--neon); letter-spacing: 1px; display: block; margin-bottom: 5px; }
  .bigbtn {
    width: 100%; padding: 17px; border-radius: 16px; border: none;
    background: var(--neon); color: #0a1200; font-size: 16.5px; font-weight: 900;
    cursor: pointer; margin-top: auto; letter-spacing: -.2px;
    box-shadow: 0 0 26px rgba(143,255,0,.25);
    transition: transform .08s;
  }
  .bigbtn:active { transform: scale(.97); }
  .bigbtn, .pbtn, .liarword, .wlist .w, .ycell, .ychip {
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .bigbtn.ghost { background: var(--card); color: var(--text); border: 1px solid var(--line); box-shadow: none; }
  .bigbtn + .bigbtn { margin-top: 10px; }
  .btnrow { display: flex; gap: 10px; margin-top: auto; }
  .btnrow .bigbtn { margin-top: 0; flex: 1; }
  .center { text-align: center; }
  .headline { font-size: 21px; font-weight: 900; text-align: center; margin: 14px 0 4px; letter-spacing: -.4px; line-height: 1.4; }
  .subline { color: var(--sub); font-size: 13.5px; text-align: center; line-height: 1.6; margin-bottom: 10px; }
  .spacer { flex: 1; }
  .stepnum { text-align:center; color: var(--sub); font-size: 12px; font-weight: 700; letter-spacing: 2px; margin-top: 6px; }

  /* ── playing cards ── */
  .cardgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0; }
  .pcard {
    aspect-ratio: 2 / 2.9; background: #f7f4ec; border-radius: 12px;
    position: relative; color: #111; font-weight: 800;
    box-shadow: 0 4px 14px rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
    animation: dealIn .4s ease backwards;
  }
  .pcard.red { color: #d21f1f; }
  .pcard .corner { position: absolute; top: 7px; left: 8px; font-size: 14px; line-height: 1.1; text-align: center; }
  .pcard .corner.b { top: auto; left: auto; bottom: 7px; right: 8px; transform: rotate(180deg); }
  .pcard .mid { font-size: 34px; }
  @keyframes dealIn { from { opacity: 0; transform: translateY(14px) scale(.9); } to { opacity: 1; transform: none; } }
  .shufflezone { position: relative; height: 240px; margin: 20px 0; }
  .shufflezone .fdcard {
    position: absolute; left: 50%; top: 50%; width: 84px; height: 122px;
    margin: -61px 0 0 -42px; border-radius: 10px;
    background: repeating-linear-gradient(45deg, #14340a 0 6px, #1d4a10 6px 12px);
    border: 2px solid #2f6b1a;
    animation: swirl 1.6s ease-in-out infinite;
  }
  @keyframes swirl {
    0%   { transform: rotate(var(--r0)) translateX(70px) rotate(0deg); }
    50%  { transform: rotate(calc(var(--r0) + 180deg)) translateX(28px) rotate(180deg); }
    100% { transform: rotate(calc(var(--r0) + 360deg)) translateX(70px) rotate(360deg); }
  }

  /* ── reveal / input ── */
  .revealnum {
    font-size: 88px; font-weight: 900; color: var(--neon); text-align: center;
    text-shadow: 0 0 40px rgba(143,255,0,.6); margin: 20px 0;
    animation: symIn .9s cubic-bezier(.2,1.4,.4,1) backwards;
  }
  @keyframes symIn { from { opacity: 0; transform: scale(.2) rotate(-30deg); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
  .lookhand {
    font-size: 30px; font-weight: 900; text-align: center; color: var(--neon);
    animation: finaltext .5s ease backwards; text-shadow: 0 0 30px rgba(143,255,0,.6);
    margin: 24px 0; line-height: 1.4;
  }
  @keyframes finaltext { from { transform: scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }
  .numinput {
    width: 100%; padding: 16px; font-size: 26px; font-weight: 800; text-align: center;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 14px;
    color: var(--text); margin: 14px 0; outline: none;
  }
  .numinput:focus { border-color: var(--neon-dim); }

  /* ── envelope / prophecy ── */
  .envelope { text-align: center; margin: 18px 0; }
  .envelope .env { font-size: 74px; display: inline-block; animation: envfloat 2.4s ease-in-out infinite; }
  @keyframes envfloat { 50% { transform: translateY(-8px) rotate(-2deg); } }
  .sealed {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    color: var(--sub); font-size: 12px; font-weight: 700; padding: 7px 14px; margin-top: 10px;
  }
  .prophecy {
    background: linear-gradient(160deg, #fdfbe8, #f3edcf);
    color: #2a2410; border-radius: 16px; padding: 26px 20px; text-align: center;
    font-size: 20px; font-weight: 800; margin: 16px 0;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    animation: symIn .8s cubic-bezier(.2,1.4,.4,1) backwards;
  }
  .prophecy .small { font-size: 12px; color: #8a7f55; font-weight: 700; letter-spacing: 2px; display: block; margin-bottom: 10px; }
  .prophecy .big { font-size: 40px; display: block; margin: 8px 0 4px; }

  /* ── 요트 다이스 ── */
  .ylabel { font-size: 12px; font-weight: 800; color: var(--sub); letter-spacing: 1px; margin: 18px 0 8px; }
  .ylabel small { font-weight: 600; letter-spacing: 0; }
  .ycount { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .ychip {
    padding: 13px 0; border-radius: 12px; background: var(--card); border: 1.5px solid var(--line);
    color: var(--text); font-weight: 800; font-size: 15px; cursor: pointer; transition: transform .08s;
  }
  .ychip:active { transform: scale(.95); }
  .ychip.on { border-color: var(--neon); color: var(--neon); background: rgba(143,255,0,.08); }
  /* 1fr 은 최소폭이 내용 크기라 input 의 기본 폭(약 20자)이 열을 밀어 화면 밖으로 넘친다 */
  .ynames { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  .yname-in {
    display: flex; align-items: center; gap: 9px; padding: 0 12px; min-width: 0;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  }
  .yname-in::before { content: ''; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--pc); box-shadow: 0 0 8px var(--pc); }
  .yname-in input {
    flex: 1; min-width: 0; width: 100%; background: none; border: none; outline: none;
    color: var(--text); font: inherit; font-size: 16px; font-weight: 700; padding: 12px 0;
  }
  .yresume {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
    margin-top: 14px; padding: 14px 16px; border-radius: 16px; cursor: pointer; text-align: left;
    background: rgba(143,255,0,.07); border: 1.5px solid var(--neon-dim); color: var(--text);
  }
  .yresume b { display: block; font-size: 15.5px; color: var(--neon); }
  .yresume small { display: block; font-size: 12px; color: var(--sub); margin-top: 3px; }
  .yresume em { font-style: normal; font-size: 20px; color: var(--neon); }

  /* 차례 넘기기 */
  .yhand { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px 0 24px; }
  .yhand .yround { font-size: 12px; font-weight: 800; letter-spacing: 3px; color: var(--sub); }
  .yhand .ybig {
    width: 120px; height: 120px; border-radius: 34px; margin: 22px 0 16px;
    display: flex; align-items: center; justify-content: center; font-size: 60px;
    background: color-mix(in srgb, var(--pc) 14%, var(--card)); border: 2px solid var(--pc);
    box-shadow: 0 0 60px color-mix(in srgb, var(--pc) 40%, transparent);
    animation: yfloat 2.4s ease-in-out infinite;
  }
  @keyframes yfloat { 50% { transform: translateY(-9px) rotate(7deg); } }
  .yhand .yname { font-size: 36px; font-weight: 900; color: var(--pc); letter-spacing: -1px; line-height: 1.2; word-break: keep-all; }
  .yhand .yturn { font-size: 17px; font-weight: 800; margin-top: 2px; }
  .yboard { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 18px; }

  /* 점수 띠 */
  .ystrip { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .ypls { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .ypls::-webkit-scrollbar { display: none; }
  .ypl {
    flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px;
    border-radius: 999px; background: var(--card); border: 1px solid var(--line);
    font-size: 12px; font-weight: 700; color: var(--sub); white-space: nowrap;
  }
  .ypl::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--pc); }
  .ypl b { color: var(--text); font-variant-numeric: tabular-nums; }
  .ypl.on { border-color: var(--pc); color: var(--text); box-shadow: 0 0 14px color-mix(in srgb, var(--pc) 30%, transparent); }
  .yico {
    flex: none; width: 34px; height: 34px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); font-size: 15px;
  }

  /* 판 — 위는 KEEP 선반, 아래는 펠트. 주사위는 둘 다 가로질러 날아다니므로 판에 직접 붙는다. */
  .ytable {
    position: relative; flex: none; height: 300px; --s: 50px;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
  }
  .yshelf { position: absolute; left: 0; right: 0; top: 0; height: 64px; display: grid; grid-template-columns: repeat(5, 1fr); }
  .yslot {
    margin: 5px; border: 1.5px dashed var(--line); border-radius: 12px;
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 2px;
    font-size: 8.5px; font-weight: 800; letter-spacing: 1.5px; color: #34452f;
  }
  .yfelt {
    position: absolute; left: 0; right: 0; top: 70px; bottom: 0; border-radius: 22px; overflow: hidden;
    background:
      radial-gradient(ellipse 90% 70% at 50% 30%, #184019, #0d220f 65%, #071307),
      #0d220f;
    box-shadow: inset 0 0 0 1px rgba(143,255,0,.22), inset 0 0 50px rgba(0,0,0,.65), 0 12px 30px rgba(0,0,0,.45);
  }
  .yfelt::before {
    content: ''; position: absolute; inset: 9px; border-radius: 15px;
    border: 1px dashed rgba(143,255,0,.12); pointer-events: none;
  }
  .ycup {
    position: absolute; width: 132px; height: 132px; margin: -66px 0 0 -66px; border-radius: 50%;
    background: radial-gradient(circle, #030703 50%, #0a160a 68%, rgba(0,0,0,0) 71%);
    box-shadow: 0 0 0 2px rgba(143,255,0,.4), 0 0 26px rgba(143,255,0,.28), inset 0 0 30px rgba(143,255,0,.12);
    opacity: 0; transform: scale(.7); transition: opacity .18s, transform .3s cubic-bezier(.3,1.6,.5,1);
  }
  .ycup.on { opacity: 1; transform: none; }
  .yhint {
    position: absolute; left: 0; right: 0; top: 20%; text-align: center; pointer-events: none;

  /* 주사위. 결과 눈은 JS 가 정하고, 큐브 회전으로 그 면을 위로 보낸다 (Y_FACE). */

    position: absolute; inset: 8%; border-radius: 24%; background: rgba(0,0,0,.6);

  .yface.f1 { transform: translateZ(calc(var(--s) / 2)); }

  .yface.f4 { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }
  .yface i { place-self: center; width: 64%; height: 64%; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #505050, #121212 70%); box-shadow: inset 0 1px 1.5px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.8); }
  .yface i.o { visibility: hidden; }

  .yring {

  .yglow {

  .ydie.glow .yglow { animation: yglow 1.1s ease-in-out infinite; }
  @keyframes yglow { 50% { opacity: 1; transform: scale(1.12); } }

  @keyframes ystamp {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(2.8) rotate(-12deg); }
    12%  { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-5deg); }

  /* 굴리기 버튼 — 누르고 있는 동안 파워가 왼쪽부터 차오른다 */

  @keyframes yrumble { 25% { translate: 1.5px -1px; } 75% { translate: -1.5px 1px; } }
  .yroll:disabled { background: var(--card); color: var(--sub); box-shadow: none; outline: 1px solid var(--line); outline-offset: -1px; cursor: default; }

  /* 점수표 */
  .ysheet { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .ycol { display: flex; flex-direction: column; gap: 5px; }
  .ycell {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;

    background: var(--card); border: 1px solid var(--line); color: var(--text);

  }
  .ycell:active { transform: scale(.97); }

  .ycell b { font-size: 15.5px; font-weight: 900; color: var(--neon); font-variant-numeric: tabular-nums; }
  .ycell:disabled { cursor: default; }
  .ycell:disabled:not(.done) { color: var(--sub); }

  @keyframes ypop { from { transform: scale(1.22); background: var(--neon); } }
  .ybonus, .ytotal {
    position: relative; overflow: hidden; height: 38px; border-radius: 11px; padding: 0 11px;

  .ymini {
    display: inline-grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    width: 17px; height: 17px; padding: 2px; margin-right: 7px; border-radius: 4px; background: #efe8d6; flex: none;

  .ymini i { place-self: center; width: 3px; height: 3px; border-radius: 50%; background: #111; }
  .ymini i.o { visibility: hidden; }
  .ymini.v1 i.p { width: 6px; height: 6px; background: #c8102e; }

  /* 전체 점수표 · 규칙 표 */
  /* 고정 레이아웃 — 6명이 여섯 글자 이름을 쓰면 자동 레이아웃은 모달 밖으로 밀려난다 */
  .ytbl { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 6px; table-layout: fixed; }
  .ytbl col.lab { width: 88px; }
  .ytbl th, .ytbl td { padding: 7px 3px; text-align: center; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .ytbl th { font-weight: 900; font-size: 11.5px; line-height: 1.25; word-break: break-all; vertical-align: bottom; }
  .ytbl td:first-child { text-align: left; color: var(--sub); font-weight: 700; white-space: nowrap; }
  .ytbl td .ymini { vertical-align: -4px; }
  .ytbl tr.sub td { color: var(--sub); font-size: 11.5px; }
  .ytbl tr.sum td { font-weight: 900; font-size: 14px; color: var(--neon); border-bottom: none; }
  .ytbl.rules { table-layout: auto; }
  .ytbl.rules td { text-align: left; }
  .ytbl.rules td:last-child { color: var(--text); }

  /* 결과 */
  .yrank { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 14px; }
  .yrow {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px;

  }
  @keyframes yrowin { from { opacity: 0; transform: translateY(18px) scale(.88); } }
  .yrow .rk { width: 30px; font-weight: 900; color: var(--sub); font-size: 14px; }

  .yrow .nm::before { content: ''; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--pc); }
  .yrow b { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .yrow.win { padding: 20px 16px; border: 1.5px solid var(--pc); background: color-mix(in srgb, var(--pc) 10%, var(--card)); box-shadow: 0 0 30px color-mix(in srgb, var(--pc) 25%, transparent); }
  .yrow.win .rk { font-size: 24px; }
  .yrow.win .nm { font-size: 19px; }
  .yrow.win b { font-size: 32px; color: var(--pc); }
  .yconf { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

  /* ── 없던 기억 ── */
  .flashword {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 52px; font-weight: 900; color: var(--text); letter-spacing: -1.5px;
    min-height: 220px; text-align: center;
  }
  .flashword span { animation: flashin .22s ease backwards; }
  @keyframes flashin { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: none; } }
  .wlist { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 14px 0; }
  .wlist .w {
    background: var(--card); border: 1px solid var(--line); border-radius: 9px;
    text-align: center; padding: 10px 2px; font-size: 13px; font-weight: 700;
  }
  .verdict {
    text-align: center; font-size: 46px; font-weight: 900; margin: 16px 0 4px;

  }
  .verdict.no { color: var(--red); }

    font-size: 58px; font-weight: 900; text-align: center; color: var(--neon);

  /* ── 라이어 ── */
  .pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 16px 0; }
  .pbtn {
    background: var(--card); border: 1.5px solid var(--line); border-radius: 14px;

  .shield {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;

  .liarword {

    gap: 12px; background: linear-gradient(160deg, #fdfbe8, #f3edcf); color: #2a2410;
    border-radius: 20px; margin: 16px 0; padding: 30px 20px; min-height: 210px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  .liarword .w { font-size: 40px; font-weight: 900; letter-spacing: -1px; }
  .liarword .cap { font-size: 12px; font-weight: 800; color: #8a7f55; letter-spacing: 2px; }

  /* ── 동시에 지목 ── */
  .prompt {
    flex: 1; display: flex; align-items: center; justify-content: center;

<body>
<div id="app">
  <header id="hdr"></header>
  <main id="main"></main>
</div>

<noscript>
  <div style="max-width:440px;margin:0 auto;padding:28px 18px;color:#eaf5e0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif">
    <h1 style="font-size:27px;font-weight:900">아이스브레이커</h1>
    <p style="color:#8fa38a;line-height:1.6;margin-top:8px">처음 만난 자리에서 폰 하나로 바로<br>우와 2 · 게임 3 — 준비물도 연습도 없이.</p>
    <ul style="margin-top:16px;line-height:2;color:#eaf5e0">
      <li>🃏 사라지는 카드 — 전원이 기억한 카드가 전부 동시에 사라진다</li>
      <li>🎲 요트 다이스 — 세 번 굴려 족보를 채우는 2~6인 주사위 게임</li>
      <li>🧠 없던 기억 — 한 번도 없던 단어를 다 같이 "봤다"고 확신한다</li>
      <li>🕵️ 라이어 — 한 명만 다른 단어, 본인도 모른다</li>
      <li>👉 동시에 지목 — 셋 세면 다 같이 한 사람을 가리킨다</li>
    </ul>
    <p style="color:#8fa38a;margin-top:16px">자바스크립트를 켜면 바로 진행할 수 있습니다.</p>
  </div>
</noscript>

<script>
"use strict";
const $main = document.getElementById('main');
const $hdr = document.getElementById('hdr');
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };

/* 화면 꺼짐 방지. 폰을 놓고 여럿이 보는 앱이라 자동 잠금이 진행을 끊는다.
   사용자 제스처 안에서만 허용되므로 게임을 여는 탭에서 잡는다.
   탭을 벗어나면 브라우저가 자동으로 놓기 때문에 돌아올 때 다시 잡는다. */
let wakeLock = null;
async function keepAwake() {
  try {
    if (!('wakeLock' in navigator) || wakeLock) return;
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) { /* 저전력 모드·미지원 브라우저 — 앱 동작에는 영향 없음 */ }
}
function releaseWake() {
  try { wakeLock && wakeLock.release(); } catch (e) {}
  wakeLock = null;
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && currentTrick) keepAwake();
});
const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const ment = t => `<div class="ment"><span class="mic">🎤 이렇게 말하세요</span>${t}</div>`;
let currentTrick = null;
// 게임이 걸어둔 리스너·루프를 홈으로 나갈 때 걷는다 (요트의 devicemotion 등)
let leaveHook = null;

/* ───────── 공통 셸 ───────── */
function setHeader(title, showSecret) {
  if (!title) { $hdr.innerHTML = ''; return; }
  $hdr.innerHTML = `
    <button class="back" id="backbtn">←</button>
    <div class="htitle">${title}</div>
    ${showSecret ? '<button class="secret" id="secretbtn">?</button>' : ''}`;
  document.getElementById('backbtn').onclick = goHome;
  const sb = document.getElementById('secretbtn');
  if (sb) sb.onclick = () => openSecret(currentTrick);
}
function stage(html) {
  $main.innerHTML = `<div class="stage">${html}</div>`;
  return $main.firstElementChild;
}
function openSecret(t) {
  if (!t) return;
  const bg = document.createElement('div');
  bg.className = 'modalbg';
  bg.innerHTML = `<div class="modal">
    <h3><span>${t.secretTitle || '🤫 마술의 원리'}</span> — ${t.title}</h3>
    ${t.secret}
    ${t.secretTitle ? '' : '<p class="warn">⚠️ 공연 중에는 절대 이 화면을 열지 마세요. 원리는 미리 익혀두고, 관객 앞에서는 자신 있게!</p>'}
    <button class="close">닫기</button>
  </div>`;
  bg.querySelector('.close').onclick = () => bg.remove();
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  document.body.appendChild(bg);
}

/* ───────── 홈 ───────── */
function goHome() {
  currentTrick = null;
  if (leaveHook) { leaveHook(); leaveHook = null; }
  releaseWake();
  setHeader(null);
  const s = stage(`
    <div class="hero">
      <div class="hat">🧊</div>
      <h1><span class="dot" aria-hidden="true"></span>아이스<em>브레이커</em></h1>
      <p>처음 만난 자리에서 폰 하나로 바로<br>우와 2 · 게임 3 — 준비물도 연습도 없이.</p>
    </div>
    <div class="tricklist">
      ${TRICKS.map((t,i) => `
        <button class="tcard" data-i="${i}">
          <div class="em">${t.emoji}</div>
          <div class="info">
            <div class="name">${t.title}<span class="tag ${t.tag.kind}">${t.tag.text}</span></div>
            <div class="desc">${t.desc}</div>
          </div>
        </button>`).join('')}
    </div>`);
  s.querySelectorAll('.tcard').forEach(b => b.onclick = () => openTrick(TRICKS[+b.dataset.i]));
}
function openTrick(t) {
  currentTrick = t;
  keepAwake();
  setHeader(`${t.emoji} ${t.title}`, true);
  t.run();
  window.scrollTo(0, 0);
}

/* ───────── 카드 유틸 ───────── */
const SUITS = { '♠':'b', '♣':'b', '♥':'r', '♦':'r' };
function pcardHTML(rank, suit, delay) {
  const red = SUITS[suit] === 'r' ? ' red' : '';
  return `<div class="pcard${red}" style="animation-delay:${delay}ms">
    <div class="corner">${rank}<br>${suit}</div>
    <div class="mid">${suit}</div>
    <div class="corner b">${rank}<br>${suit}</div>
  </div>`;
}

/* ═════════ 2. 요트 다이스 ═════════ */
/* 세계 게임전집 51 규칙. 폰 하나를 돌려가며 2~6명.
   이 게임의 전부는 '굴리는 맛'이다 — 꾹 눌러 흔들고(덜그럭) 떼면 던진다.
   눈은 던지는 순간 먼저 정하고, 애니메이션이 그 면으로 떨어지도록 역산한다. */
const Y_CATS = [
  { k: '1', up: 1 }, { k: '2', up: 2 }, { k: '3', up: 3 },
  { k: '4', up: 4 }, { k: '5', up: 5 }, { k: '6', up: 6 },
  { k: 'choice', name: '초이스' },
  { k: 'four',   name: '포 다이스' },
  { k: 'full',   name: '풀하우스' },
  { k: 'ss',     name: 'S. 스트레이트' },
  { k: 'ls',     name: 'L. 스트레이트' },
  { k: 'yacht',  name: '요트' },
];
const Y_COLORS = ['#8FFF00', '#ffbe73', '#5cc8ff', '#ff7ab8', '#c59bff', '#ffe45c'];
const Y_SAVE = 'trick.yacht.v1', Y_MUTE = 'trick.yacht.mute';
const Y_PIPS = { 1: [4], 2: [2,6], 3: [2,4,6], 4: [0,2,6,8], 5: [0,2,4,6,8], 6: [0,2,3,5,6,8] };
// 그 눈을 위로 보내는 큐브 회전. CSS 면 배치(.yface.f1~f6)의 역회전이라 둘은 같이 움직여야 한다.
const Y_FACE = { 1: { rx: 0, ry: 0 }, 2: { rx: 0, ry: -90 }, 3: { rx: -90, ry: 0 },
                 4: { rx: 90, ry: 0 }, 5: { rx: 0, ry: 90 }, 6: { rx: 0, ry: 180 } };
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd = (a, b) => a + Math.random() * (b - a);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// 사파리 사생활 보호 모드 등에서는 localStorage 가 던진다. 저장은 편의일 뿐이니 조용히 넘긴다.
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },
};

function yCounts(d) { const c = [0,0,0,0,0,0,0]; d.forEach(v => c[v]++); return c; }
function yScore(k, d) {
  const c = yCounts(d), sum = d.reduce((a, b) => a + b, 0);
  const has = run => run.every(v => c[v] > 0);
  switch (k) {
    case 'choice': return sum;
    case 'four':   return c.some(n => n >= 4) ? sum : 0;
    case 'full':   return c.includes(3) && c.includes(2) ? sum : 0;   // 5개 같은 눈은 풀하우스가 아니다
    case 'ss':     return [[1,2,3,4],[2,3,4,5],[3,4,5,6]].some(has) ? 15 : 0;
    case 'ls':     return [[1,2,3,4,5],[2,3,4,5,6]].some(has) ? 30 : 0;
    case 'yacht':  return c.includes(5) ? 50 : 0;
    default:       return c[+k] * +k;
  }
}
const yUpper  = p => Y_CATS.slice(0, 6).reduce((a, c) => a + (p.s[c.k] || 0), 0);
const yBonus  = p => yUpper(p) >= 63 ? 35 : 0;
const yTotal  = p => Object.values(p.s).reduce((a, b) => a + b, 0) + yBonus(p);
const yFilled = p => Object.keys(p.s).length;

// 방금 나온 눈에서 제일 센 족보 하나와, 그 족보를 이루는 주사위 번호들
function yCombo(d) {
  const c = yCounts(d), idxOf = v => d.map((x, i) => x === v ? i : -1).filter(i => i >= 0);
  if (c.includes(5)) return { name: 'YACHT!', big: true, idx: [0,1,2,3,4] };
  if (yScore('ls', d)) return { name: '라지 스트레이트!', idx: [0,1,2,3,4] };
  const four = c.findIndex(n => n >= 4);
  if (four > 0) return { name: '포 다이스!', idx: idxOf(four) };
  if (yScore('full', d)) return { name: '풀하우스!', idx: [0,1,2,3,4] };
  const run = [[3,4,5,6],[2,3,4,5],[1,2,3,4]].find(r => r.every(v => c[v]));
  if (run) return { name: '스몰 스트레이트', idx: run.map(v => d.indexOf(v)) };
  return null;
}

/* 효과음은 전부 WebAudio 로 합성한다. 파일이 없으니 오프라인에서도 그대로 난다.
   iOS 는 사용자 탭 안에서만 소리를 풀어주므로 버튼마다 unlock() 을 부른다. */
const ySfx = (() => {
  let ctx = null, noise = null, muted = store.get(Y_MUTE) === '1';
  const ac = () => {
    if (muted) return null;
    try {
      if (!ctx) {
        const C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        ctx = new C();
        noise = ctx.createBuffer(1, ctx.sampleRate / 2, ctx.sampleRate);
        const ch = noise.getChannelData(0);
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (e) { return null; }
  };
  // 필터 건 노이즈 한 조각 — 주사위끼리, 주사위와 판이 부딪치는 소리
  const hit = (vol, freq, dur, q, type = 'bandpass') => {
    const c = ac(); if (!c || vol <= 0) return;
    const t = c.currentTime, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = noise; f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(Math.min(1, vol), t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(t, Math.random() * .4, dur + .02);
  };
  const tone = (freq, dur, vol, type = 'triangle', at = 0, to) => {
    const c = ac(); if (!c) return;
    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .008);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + .02);
  };
  return {
    unlock: ac,
    get muted() { return muted; },
    toggle() { muted = !muted; store.set(Y_MUTE, muted ? '1' : null); ac(); return muted; },
    rattle: p => {
      hit(.16 + .3 * p, rnd(2400, 4200), .03, 7);
      if (Math.random() < .4) hit(.1 + .2 * p, rnd(1100, 1900), .04, 5);
    },
    clack: v => { hit(.85 * v, rnd(1400, 2400), .07, 3); hit(.5 * v, rnd(280, 460), .09, 1.2, 'lowpass'); },
    whoosh: p => {
      const c = ac(); if (!c) return;
      const t = c.currentTime, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      src.buffer = noise; f.type = 'bandpass'; f.Q.value = 1.2;
      f.frequency.setValueAtTime(450, t); f.frequency.exponentialRampToValueAtTime(2800, t + .22);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.1 + .18 * p, t + .05);
      g.gain.exponentialRampToValueAtTime(.0001, t + .28);
      src.connect(f); f.connect(g); g.connect(c.destination);
      src.start(t, 0, .3);
    },
    keep:   () => { tone(988, .06, .16, 'square'); tone(1480, .09, .12, 'triangle', .045); },
    unkeep: () => tone(740, .08, .12, 'triangle', 0, 480),
    blip:   i => tone(520 + i * 70, .06, .12, 'square'),
    combo:  () => [659, 880, 1175].forEach((f, i) => tone(f, .16, .15, 'square', i * .07)),
    fanfare: () => {
      [523, 659, 784, 1047].forEach((f, i) => tone(f, .2, .16, 'square', i * .09));
      tone(1319, .8, .18, 'triangle', .38); tone(1047, .8, .1, 'square', .38);
    },
    score: v => v
      ? [0, 1, 2].forEach(i => tone((v >= 25 ? 740 : 620) * Math.pow(1.26, i), .1, .14, 'triangle', i * .06))
      : tone(220, .38, .16, 'sawtooth', 0, 100),
  };
})();

const yPips = v => Array.from({ length: 9 }, (_, c) => `<i class="${Y_PIPS[v].includes(c) ? 'p' : 'o'}"></i>`).join('');
const yMini = v => `<i class="ymini v${v}">${yPips(v)}</i>`;
const yDieHTML = i => `
  <div class="ydie" data-i="${i}">
    <div class="yglow"></div><div class="yshadow"></div>
    <div class="ycube">
      ${[1,2,3,4,5,6].map(v => `<div class="yface f${v} v${v}">${yPips(v)}</div>`).join('')}
    </div>
    <div class="yring"></div>
  </div>`;

function yLoad() {
  try {
    const g = JSON.parse(store.get(Y_SAVE));
    const ok = g && Array.isArray(g.players) && g.players.length >= 2 && g.players.length <= 6
      && g.players.every(p => p && typeof p.name === 'string' && typeof p.color === 'string' && p.s && typeof p.s === 'object')
      && Number.isInteger(g.cur) && g.cur >= 0 && g.cur < g.players.length
      && !g.players.every(p => yFilled(p) >= 12);
    return ok ? g : null;
  } catch (e) { return null; }
}

function yTable(G) {
  const row = (label, f, cls = '') =>
    `<tr class="${cls}"><td>${label}</td>${G.players.map(p => `<td>${f(p)}</td>`).join('')}</tr>`;
  const bg = document.createElement('div');
  bg.className = 'modalbg';
  bg.innerHTML = `<div class="modal">
    <h3><span>📋 전체 점수표</span></h3>
    <table class="ytbl">
      <colgroup><col class="lab">${G.players.map(() => '<col>').join('')}</colgroup>
      <thead><tr><th></th>${G.players.map(p => `<th style="color:${p.color}">${esc(p.name)}</th>`).join('')}</tr></thead>
      <tbody>
        ${Y_CATS.slice(0, 6).map(c => row(`${yMini(c.up)}${c.up}`, p => p.s[c.k] ?? '·')).join('')}
        ${row('보너스', p => yBonus(p) ? '+35' : `${yUpper(p)}/63`, 'sub')}
        ${Y_CATS.slice(6).map(c => row(c.name, p => p.s[c.k] ?? '·')).join('')}
        ${row('합계', yTotal, 'sum')}
      </tbody>
    </table>
    <button class="close">닫기</button>
  </div>`;
  bg.querySelector('.close').onclick = () => bg.remove();
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  document.body.appendChild(bg);
}

function yCountUp(el, a, b, ms = 650) {
  if (!el) return;
  const t0 = performance.now();
  (function f(now) {
    const p = Math.min(1, (now - t0) / ms);
    el.textContent = Math.round(a + (b - a) * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(f);
  })(t0);
}

function yConfetti(ms = 2600) {
  if (RM) return;
  const cv = document.createElement('canvas');
  cv.className = 'yconf';
  document.body.appendChild(cv);
  const dpr = Math.min(2, devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d');
  g.scale(dpr, dpr);
  const cols = [...Y_COLORS, '#ffffff'];
  const ps = Array.from({ length: 170 }, () => ({
    x: W / 2 + rnd(-50, 50), y: H * .42, vx: rnd(-10, 10), vy: rnd(-19, -6),
    r: rnd(0, 6.3), vr: rnd(-.3, .3), w: rnd(6, 11), h: rnd(3, 6), c: cols[Math.random() * cols.length | 0],
  }));
  const t0 = performance.now();
  (function f(now) {
    const t = now - t0;
    g.clearRect(0, 0, W, H);
    g.globalAlpha = Math.max(0, 1 - Math.max(0, t - ms * .6) / (ms * .4));
    for (const p of ps) {
      p.vy += .42; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r);
      g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)) + 1);
      g.restore();
    }
    if (t < ms) requestAnimationFrame(f); else cv.remove();
  })(t0);
}

// iOS 는 흔들기(devicemotion)를 쓰려면 탭 안에서 권한을 받아야 한다. 거절해도 버튼으로 다 된다.
let yMotionAsked = false;
function yAskMotion() {
  if (yMotionAsked) return;
  yMotionAsked = true;
  try {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function')
      DeviceMotionEvent.requestPermission().catch(() => {});
  } catch (e) {}
}

function trickYacht() {
  if (leaveHook) leaveHook();
  let G = null, T = null;
  const onMotion = e => { if (T && T.motion) T.motion(e); };
  addEventListener('devicemotion', onMotion);
  leaveHook = () => {
    removeEventListener('devicemotion', onMotion);
    if (T) cancelAnimationFrame(T.raf);
    T = null;
  };
  const save = () => store.set(Y_SAVE, JSON.stringify(G));
  setup();

  function setup() {
    const saved = yLoad();
    let n = saved ? saved.players.length : 4;
    const names = [];
    const s = stage(`
      <div class="headline">요트 다이스 🎲</div>
      <div class="subline">주사위 다섯 개를 한 차례에 최대 <b>세 번</b> 굴려<br>족보 12칸을 채웁니다. 합계가 제일 높으면 승리!</div>
      ${saved ? `<button class="yresume" id="resume">
          <span><b>이어하기</b><small>라운드 ${yFilled(saved.players[saved.cur]) + 1} / 12 · ${saved.players.map(p => esc(p.name)).join(' · ')}</small></span>
          <em>→</em>
        </button>` : ''}
      <div class="ylabel">몇 명이 하나요?</div>
      <div class="ycount">${[2,3,4,5,6].map(k => `<button class="ychip" data-n="${k}">${k}명</button>`).join('')}</div>
      <div class="ylabel">이름 <small>· 비워두면 번호로 부릅니다</small></div>
      <div class="ynames" id="names"></div>
      <div class="spacer" style="min-height:20px"></div>
      <button class="bigbtn" id="go">새 게임 시작 🎲</button>`);
    const box = s.querySelector('#names');
    const draw = () => {
      box.querySelectorAll('input').forEach((el, i) => { names[i] = el.value; });
      s.querySelectorAll('.ychip').forEach(b => b.classList.toggle('on', +b.dataset.n === n));
      box.innerHTML = Array.from({ length: n }, (_, i) => `
        <label class="yname-in" style="--pc:${Y_COLORS[i]}">
          <input maxlength="6" placeholder="${i + 1}번" value="${esc(names[i] || '')}" autocomplete="off">
        </label>`).join('');
    };
    draw();
    s.querySelectorAll('.ychip').forEach(b => b.onclick = () => { n = +b.dataset.n; vib(8); draw(); });
    s.querySelector('#go').onclick = () => {
      yAskMotion(); ySfx.unlock();
      G = { cur: 0, players: [...box.querySelectorAll('input')].map((el, i) =>
        ({ name: el.value.trim() || `${i + 1}번`, color: Y_COLORS[i], s: {} })) };
      save(); handoff();
    };
    const rs = s.querySelector('#resume');
    if (rs) rs.onclick = () => { yAskMotion(); ySfx.unlock(); G = saved; handoff(); };
  }

  /* 폰을 넘기는 순간. 누구 차례인지 화면 전체로 못 박아서 "내 차례야?"를 없앤다. */
  function handoff() {
    const p = G.players[G.cur];
    const s = stage(`
      <div class="yhand" style="--pc:${p.color}">
        <div class="yround">ROUND ${yFilled(p) + 1} / 12</div>
        <div class="ybig">🎲</div>
        <div class="yname">${esc(p.name)}</div>
        <div class="yturn">차례입니다</div>
        <div class="subline" style="margin-top:8px">폰을 <b>${esc(p.name)}</b>에게 넘겨주세요</div>
        <div class="yboard">${G.players.map((q, i) =>
          `<span class="ypl${i === G.cur ? ' on' : ''}" style="--pc:${q.color}">${esc(q.name)} <b>${yTotal(q)}</b></span>`).join('')}</div>
      </div>
      <button class="bigbtn" id="go" style="background:${p.color};box-shadow:0 0 30px ${p.color}55">굴리러 가기 →</button>`);
    s.querySelector('#go').onclick = () => { ySfx.unlock(); vib(15); turn(); };
  }

  function turn() {
    const me = G.cur, p = G.players[me];
    const s = stage(`
      <div class="ystrip">
        <div class="ypls">${G.players.map((q, i) =>
          `<span class="ypl${i === me ? ' on' : ''}" style="--pc:${q.color}">${esc(q.name)} <b data-p="${i}">${yTotal(q)}</b></span>`).join('')}</div>
        <button class="yico" id="tbl" aria-label="전체 점수표">📋</button>
        <button class="yico" id="mute" aria-label="소리 켜기/끄기">${ySfx.muted ? '🔇' : '🔊'}</button>
      </div>
      <div class="ytable" id="tb">
        <div class="yshelf">${'<div class="yslot">KEEP</div>'.repeat(5)}</div>
        <div class="yfelt">
          <div class="ycup" id="cup"></div>
          <div class="yhint" id="hint">버튼을 <b>꾹</b> 눌러 흔들고, 떼면 던져요<br>폰을 흔들어도 굴러갑니다</div>
        </div>
        ${[0,1,2,3,4].map(yDieHTML).join('')}
        <div class="yflash" id="flash"></div>
        <div class="ystamp" id="stamp"></div>
      </div>
      <button class="yroll" id="roll"><i class="ypow"></i><span id="lbl"></span><span class="yleft" id="left"></span></button>
      <div class="ysheet" id="sheet"></div>`);
    const $ = q => s.querySelector(q);
    const tb = $('#tb'), cup = $('#cup'), roll = $('#roll'), sheet = $('#sheet'), stamp = $('#stamp');
    const dice = [...tb.querySelectorAll('.ydie')];
    const cubes = dice.map(d => d.querySelector('.ycube'));
    const shadows = dice.map(d => d.querySelector('.yshadow'));

    // 판 좌표계. 선반(0~64) 아래 70px 부터가 펠트다 — CSS 의 .yshelf/.yfelt 와 같은 숫자.
    const W = tb.clientWidth, H = tb.clientHeight, FELT = 70;
    const S = Math.round(Math.max(40, Math.min(54, W / 7.2)));
    tb.style.setProperty('--s', S + 'px');
    const CUP = { x: W / 2, y: H - 80 };
    cup.style.left = CUP.x + 'px';
    cup.style.top = (CUP.y - FELT) + 'px';

    const alive = () => T && document.body.contains(tb);
    const dT = q => `translate3d(${q.x - S / 2}px,${q.y - S / 2}px,0) scale(${q.s})`;
    const cT = r => `rotateZ(${r.yaw}deg) rotateX(${r.rx}deg) rotateY(${r.ry}deg)`;
    const cupSpot = (j, n) => {
      if (n === 1) return { x: CUP.x, y: CUP.y, s: .74 };
      const a = j / n * Math.PI * 2 - Math.PI / 2, r = n === 2 ? 16 : 24;
      return { x: CUP.x + Math.cos(a) * r, y: CUP.y + Math.sin(a) * r, s: .74 };
    };
    const shelfSpot = i => ({ x: W * (i + .5) / 5, y: 32, s: .84 });
    const free = () => [0,1,2,3,4].filter(i => !T.kept[i]);
    const canRoll = () => alive() && !T.busy && !T.holding && T.rolls < 3 && free().length > 0;

    T = {
      rolls: 0, busy: false, holding: null, armed: null, power: 0, motionPow: 0, raf: 0, frame: 0, coolUntil: 0,
      dice: [0,1,2,3,4].map(() => 1 + (Math.random() * 6 | 0)),
      kept: [false, false, false, false, false], pos: [], home: [], rot: [],
    };
    dice.forEach((el, i) => {
      const f = Y_FACE[T.dice[i]];
      T.rot[i] = { rx: f.rx, ry: f.ry, yaw: rnd(0, 360) };
      T.pos[i] = cupSpot(i, 5);
      el.style.transform = dT(T.pos[i]);
      cubes[i].style.transform = cT(T.rot[i]);
    });
    cup.classList.add('on');
    paintRoll(); renderSheet();

    function moveDie(i, to, dur, easing) {
      dice[i].animate([{ transform: dT(T.pos[i]) }, { transform: dT(to) }], { duration: dur, easing });
      T.pos[i] = to;
      dice[i].style.transform = dT(to);
    }

    // 서로 겹치지 않는 착지점. avoid 에 든 자리도 피한다.
    function spots(n, avoid = []) {
      const out = [...avoid], m = S * .8;
      for (let k = 0; k < n; k++) {
        let best = null, bd = -1;
        for (let t = 0; t < 80; t++) {
          const q = { x: rnd(m, W - m), y: rnd(FELT + m, H - m) };
          const d = out.reduce((a, o) => Math.min(a, Math.hypot(q.x - o.x, q.y - o.y)), Infinity);
          if (d > bd) { bd = d; best = q; }
          if (d > S * 1.5) break;
        }
        out.push(best);
      }
      return out.slice(avoid.length);
    }

    function paintRoll() {
      $('#left').textContent = '●'.repeat(3 - T.rolls) + '○'.repeat(T.rolls);
      roll.disabled = !T.holding && !canRoll();
      roll.classList.toggle('hold', !!T.holding);
      $('#lbl').textContent =
          T.holding       ? '덜그럭… 떼면 던져요!'
        : T.rolls >= 3    ? '칸을 골라 기록하세요'
        : !free().length  ? '전부 킵 — 칸을 고르세요'
        : T.rolls === 0   ? '꾹 눌러 흔들기'
        :                   '다시 굴리기 · 남길 건 먼저 탭';
    }

    /* ── 흔들기: 누르고 있는 동안 컵 속에서 덜그럭 ── */
    function startShake(src) {
      T.holding = src; T.t0 = performance.now(); T.power = 0; T.frame = 0;
      T.motionPow = src === 'motion' ? .25 : 0; T.lastShake = T.t0; T.nextClack = 0; T.armed = null;
      ySfx.unlock();
      $('#hint').classList.add('off');
      stamp.className = 'ystamp';
      dice.forEach(d => d.classList.remove('glow'));
      cup.classList.add('on');
      const f = free();
      f.forEach((i, j) => moveDie(i, cupSpot(j, f.length), 150, 'ease-in'));
      T.gatherUntil = T.t0 + 150;
      paintRoll(); renderSheet();
      T.raf = requestAnimationFrame(rattle);
    }

    function rattle(now) {
      if (!alive() || !T.holding) return;
      T.power = Math.min(1, Math.max((now - T.t0) / 1200, T.motionPow));
      if (T.holding === 'motion' && now - T.lastShake > 280) return doThrow();
      if (now > T.gatherUntil && T.frame++ % 2 === 0) {
        const f = free(), amp = 2 + 6 * T.power, sp = 12 + 30 * T.power;
        f.forEach((i, j) => {
          const c = cupSpot(j, f.length), r = T.rot[i];
          T.pos[i] = { x: c.x + rnd(-amp, amp), y: c.y + rnd(-amp, amp), s: c.s };
          r.rx += rnd(-sp, sp); r.ry += rnd(-sp, sp); r.yaw += rnd(-sp, sp);
          dice[i].style.transform = dT(T.pos[i]);
          cubes[i].style.transform = cT(r);
        });
        if (now >= T.nextClack) {
          ySfx.rattle(T.power); vib(5);
          T.nextClack = now + rnd(60, 150) * (1.3 - .7 * T.power);
        }
      }
      roll.style.setProperty('--pw', T.power.toFixed(3));
      T.raf = requestAnimationFrame(rattle);
    }

    /* ── 던지기: 떼는 순간 눈을 정하고, 그 면으로 떨어지는 궤적을 역산한다 ── */
    function doThrow() {
      if (!T.holding) return;
      cancelAnimationFrame(T.raf);
      const power = Math.max(.3, T.power);
      T.holding = null; T.busy = true; T.rolls++;
      roll.style.setProperty('--pw', 0);
      cup.classList.remove('on');
      const f = free(), targets = spots(f.length);
      f.forEach(i => { T.dice[i] = 1 + (Math.random() * 6 | 0); });
      ySfx.whoosh(power); vib(18);
      let end = 0, hit = Infinity;
      f.forEach((i, j) => {
        const dur = (RM ? 420 : 780 + 420 * power) * rnd(.88, 1.12);
        hit = Math.min(hit, fling(i, targets[j], dur, power));
        end = Math.max(end, dur);
      });
      T.coolUntil = performance.now() + end + 700;   // 흔들던 손이 멈추는 동안 또 굴러가지 않게
      setTimeout(() => { if (alive()) jolt(power); }, hit);
      setTimeout(() => { if (alive()) landed(); }, end + 60);
      paintRoll(); renderSheet();
    }

    function fling(i, to, dur, power) {
      const from = T.pos[i], r0 = T.rot[i], f = Y_FACE[T.dice[i]];
      const turns = RM ? 0 : 1 + Math.round(power * 2 + Math.random());
      const dir = () => Math.random() < .5 ? -1 : 1;
      // 목표 각은 '그 면 + 360° 의 배수' — 몇 바퀴를 돌든 마지막엔 정해둔 눈이 위로 온다
      const r1 = {
        rx: f.rx + 360 * (Math.round((r0.rx - f.rx) / 360) + turns * dir()),
        ry: f.ry + 360 * (Math.round((r0.ry - f.ry) / 360) + Math.max(0, turns - (Math.random() * 2 | 0)) * dir()),
        yaw: r0.yaw + dir() * rnd(60, 160 + 240 * power),
      };
      // 튀어 오르는 높이. [시작, 끝, 최고점] — 첫 포물선이 크고 바운스마다 줄어든다
      const peak = .75 + .55 * power;
      const B = RM ? [[0, 1, .2]] : [[0, .5, peak], [.5, .76, peak * .34], [.76, .9, peak * .12], [.9, 1, 0]];
      const hgt = p => { for (const [a, b, h] of B) if (p <= b) return h * Math.sin(Math.PI * (p - a) / (b - a)); return 0; };
      const land = { x: to.x, y: to.y, s: 1 };
      const K = 40, kd = [], ks = [], kc = [];
      for (let k = 0; k <= K; k++) {
        const p = k / K, e = 1 - Math.pow(1 - p, 2.4), re = 1 - Math.pow(1 - p, 2), h = hgt(p);
        kd.push({ offset: p, transform: dT({
          x: from.x + (land.x - from.x) * e,
          y: from.y + (land.y - from.y) * e,
          s: from.s + (1 - from.s) * Math.min(1, p * 3) + .45 * h,
        }) });
        ks.push({ offset: p, transform: `translate(${3 + 20 * h}px,${5 + 26 * h}px) scale(${1 - .3 * h})`, opacity: Math.max(.12, .55 - .35 * h) });
        kc.push({ offset: p, transform: cT({
          rx: r0.rx + (r1.rx - r0.rx) * re,
          ry: r0.ry + (r1.ry - r0.ry) * re,
          yaw: r0.yaw + (r1.yaw - r0.yaw) * re,
        }) });
      }
      const o = { duration: dur, easing: 'linear' };
      dice[i].animate(kd, o); shadows[i].animate(ks, o); cubes[i].animate(kc, o);
      const norm = a => ((a % 360) + 360) % 360;
      T.pos[i] = land; T.home[i] = land;
      T.rot[i] = { rx: norm(r1.rx), ry: norm(r1.ry), yaw: norm(r1.yaw) };
      dice[i].style.transform = dT(land);
      cubes[i].style.transform = cT(T.rot[i]);
      // 바운스마다 '딱' — 두 번째부터는 점점 작게
      B.slice(0, -1).forEach(([, b], n) =>
        setTimeout(() => { if (alive()) ySfx.clack(power * ([1, .5, .22][n] || .2)); }, b * dur));
      return B[0][1] * dur;
    }

    function jolt(power) {
      vib(25);
      if (RM) return;
      const a = 2 + 4 * power;
      tb.animate([
        { transform: 'none' }, { transform: `translate(${a}px,${-a}px)` },
        { transform: `translate(${-a}px,${a * .6}px)` }, { transform: `translate(${a * .4}px,0)` }, { transform: 'none' },
      ], { duration: 220, easing: 'ease-out' });
    }

    function showStamp(html, big) {
      stamp.innerHTML = html;
      stamp.className = 'ystamp';
      void stamp.offsetWidth;   // 애니메이션을 처음부터 다시 틀기 위한 리플로우
      stamp.className = 'ystamp show' + (big ? ' big' : '');
    }

    function landed() {
      T.busy = false;
      const c = yCombo(T.dice);
      if (c) {
        c.idx.forEach(i => dice[i].classList.add('glow'));
        if (c.big) {
          showStamp(T.rolls === 1 ? 'YACHT!<small>한 번에!</small>' : 'YACHT!', true);
          $('#flash').animate([{ opacity: 0 }, { opacity: .85 }, { opacity: 0 }], { duration: 380 });
          yConfetti(); ySfx.fanfare(); vib([60, 40, 60, 40, 220]);
        } else {
          showStamp(c.name, false);
          ySfx.combo(); vib([30, 30, 60]);
        }
      }
      paintRoll(); renderSheet();
    }

    /* ── 킵: 탭하면 선반으로 착, 다시 탭하면 판으로 ── */
    tb.addEventListener('click', e => {
      const el = e.target.closest('.ydie');
      if (!el || !alive() || T.busy || T.holding || T.rolls === 0 || T.rolls >= 3) return;
      const i = +el.dataset.i;
      T.kept[i] = !T.kept[i];
      el.classList.toggle('kept', T.kept[i]);
      let to;
      if (T.kept[i]) {
        // 선반에서는 가지런히 — 눈은 그대로 두고 비틀린 각만 90° 단위로 편다
        const r = T.rot[i], st = { ...r, yaw: Math.round(r.yaw / 90) * 90 };
        cubes[i].animate([{ transform: cT(r) }, { transform: cT(st) }], { duration: 260, easing: 'ease-out' });
        T.rot[i] = st; cubes[i].style.transform = cT(st);
        to = shelfSpot(i);
      } else {
        const others = [0,1,2,3,4].filter(j => j !== i && !T.kept[j]).map(j => T.pos[j]);
        const h = T.home[i], clear = others.every(o => Math.hypot(o.x - h.x, o.y - h.y) > S * 1.2);
        to = clear ? h : { ...spots(1, others)[0], s: 1 };
        T.home[i] = to;
      }
      moveDie(i, to, 280, 'cubic-bezier(.3,1.5,.5,1)');
      T.kept[i] ? ySfx.keep() : ySfx.unkeep();
      vib(10);
      paintRoll();
    });

    roll.addEventListener('pointerdown', e => {
      if (!canRoll()) return;
      e.preventDefault();
      try { roll.setPointerCapture(e.pointerId); } catch (_) {}
      startShake('pointer');
    });
    const release = () => { if (alive() && T.holding === 'pointer') doThrow(); };
    roll.addEventListener('pointerup', release);
    roll.addEventListener('pointercancel', release);
    roll.addEventListener('contextmenu', e => e.preventDefault());
    roll.addEventListener('keydown', e => {
      if ((e.key === ' ' || e.key === 'Enter') && !e.repeat && canRoll()) { e.preventDefault(); startShake('pointer'); }
    });
    roll.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') release(); });

    // 폰 흔들기. 세게 흔드는 동안 컵이 덜그럭거리고, 손을 멈추면(280ms) 던진다.
    T.motion = e => {
      if (!alive() || performance.now() < T.coolUntil) return;
      const a = e.acceleration;
      let m;
      if (a && a.x != null) m = Math.hypot(a.x, a.y, a.z);
      else {
        const g = e.accelerationIncludingGravity;
        if (!g || g.x == null) return;
        m = Math.abs(Math.hypot(g.x, g.y, g.z) - 9.81);
      }
      if (m < 12) return;
      if (!T.holding) { if (!canRoll()) return; startShake('motion'); }
      T.lastShake = performance.now();
      T.motionPow = Math.min(1, T.motionPow + m / 260);
    };

    /* ── 점수표: 탭 한 번은 고르기, 한 번 더는 기록 ── */
    function renderSheet() {
      const show = T.rolls > 0 && !T.busy && !T.holding;
      const prev = {};
      if (show) Y_CATS.forEach(c => { if (!(c.k in p.s)) prev[c.k] = yScore(c.k, T.dice); });
      const best = Math.max(0, ...Object.values(prev));
      const cell = c => {
        const done = c.k in p.s, v = done ? p.s[c.k] : prev[c.k], armed = !done && T.armed === c.k;
        const cls = done ? 'done' : !show ? '' : armed ? 'armed' : v === 0 ? 'zero' : v === best ? 'best' : '';
        const label = armed ? '한 번 더 탭 ✓' : c.up ? `${yMini(c.up)}${c.up}` : c.name;
        return `<button class="ycell ${cls}" data-k="${c.k}"${done || !show ? ' disabled' : ''}>
          <span class="yl">${label}</span><b>${v ?? ''}</b></button>`;
      };
      const up = yUpper(p), got = up >= 63;
      sheet.innerHTML = `
        <div class="ycol">
          ${Y_CATS.slice(0, 6).map(cell).join('')}
          <div class="ybonus${got ? ' got' : ''}"><i style="width:${Math.min(100, up / 63 * 100)}%"></i>
            <span>보너스</span><span>${got ? '+35' : `${up} / 63`}</span></div>
        </div>
        <div class="ycol">
          ${Y_CATS.slice(6).map(cell).join('')}
          <div class="ytotal"><span>합계</span><b>${yTotal(p)}</b></div>
        </div>`;
    }
    sheet.addEventListener('click', e => {
      const b = e.target.closest('.ycell');
      if (!b || b.disabled || !alive() || T.busy || T.holding) return;
      const k = b.dataset.k;
      if (T.armed === k) return commit(k);
      T.armed = k;
      ySfx.blip(2); vib(8);
      renderSheet();
    });

    function commit(k) {
      const v = yScore(k, T.dice), before = yTotal(p), hadBonus = yBonus(p) > 0;
      p.s[k] = v;
      T.busy = true; T.armed = null;
      G.cur = (me + 1) % G.players.length;
      save();
      renderSheet(); paintRoll();
      sheet.querySelector(`[data-k="${k}"]`).classList.add('pop');
      yCountUp(s.querySelector(`.ypls b[data-p="${me}"]`), before, yTotal(p));
      ySfx.score(v); vib(v ? [20, 30, 40] : 90);
      const bonusNow = !hadBonus && yBonus(p) > 0;
      if (bonusNow) setTimeout(() => {
        if (!alive()) return;
        showStamp('보너스 +35!', false); ySfx.combo(); vib([30, 30, 60]);
      }, 450);
      setTimeout(() => {
        if (!alive()) return;
        G.players.every(q => yFilled(q) >= 12) ? finish() : handoff();
      }, bonusNow ? 2000 : 1200);
    }

    $('#mute').onclick = e => { e.currentTarget.textContent = ySfx.toggle() ? '🔇' : '🔊'; };
    $('#tbl').onclick = () => yTable(G);
  }

  function finish() {
    store.set(Y_SAVE, null);
    const ranked = G.players.map(p => ({ p, t: yTotal(p) })).sort((a, b) => b.t - a.t);
    ranked.forEach((r, i) => { r.rank = i && r.t === ranked[i - 1].t ? ranked[i - 1].rank : i + 1; });
    const n = ranked.length, step = RM ? 200 : 750;
    const s = stage(`
      <div class="headline">최종 결과 🏆</div>
      <div class="subline">꼴찌부터 공개합니다…</div>
      <div class="yrank">${ranked.map((r, i) => `
        <div class="yrow${r.rank === 1 ? ' win' : ''}" style="--pc:${r.p.color};animation-delay:${(n - 1 - i) * step}ms">
          <span class="rk">${r.rank === 1 ? '👑' : r.rank + '위'}</span>
          <span class="nm">${esc(r.p.name)}</span><b>${r.t}</b>
        </div>`).join('')}</div>
      <button class="bigbtn ghost" id="tbl" style="margin-top:0">📋 전체 점수표</button>
      <div class="spacer" style="min-height:16px"></div>
      <div class="btnrow">
        <button class="bigbtn ghost" id="home">처음으로</button>
        <button class="bigbtn" id="again">한 판 더</button>
      </div>`);
    ranked.forEach((r, i) => setTimeout(() => {
      if (!document.body.contains(s)) return;
      if (i === 0) { ySfx.fanfare(); yConfetti(); vib([80, 50, 80, 50, 260]); }
      else { ySfx.blip(n - i); vib(15); }
    }, (n - 1 - i) * step + 150));
    s.querySelector('#tbl').onclick = () => yTable(G);
    s.querySelector('#home').onclick = goHome;
    s.querySelector('#again').onclick = () => {
      ySfx.unlock();
      G = { cur: 0, players: G.players.map(p => ({ ...p, s: {} })) };
      save(); handoff();
    };
  }
}

/* ═════════ 3. 없던 기억 ═════════ */
/* DRM(가짜기억) 패러다임. 목록의 어떤 단어에도 미끼 단어의 글자가 들어가면 안 된다.
   (예: 미끼 '잠'에 '낮잠'을 넣으면 "낮잠 있었잖아요" 반박으로 효과가 깨진다) */
const MEM_SETS = [
  { lure: '잠',
    words: ['침대','휴식','깨다','피곤','꾸다','밤','담요','졸음','코골이','하품','나른함','이불','베개','자장가','눈꺼풀'],
    hit: '꾸다', miss: '의자' },
  { lure: '바늘',
    words: ['실','핀','골무','가시','주사기','따끔','천','단추','옷감','수선','뾰족','찌르다','압정','재봉틀','꿰매다'],
    hit: '골무', miss: '달력' },
  { lure: '설탕',
    words: ['카라멜','꿀','초콜릿','케이크','신맛','쓴맛','딸기잼','시럽','달콤','도넛','마카롱','사이다','충치','디저트','젤리'],
    hit: '시럽', miss: '우산' },
];
function trickMemory() {
  const set = MEM_SETS[Math.floor(Math.random() * MEM_SETS.length)];
  const order = shuffle(set.words);
  const QUIZ = [
    { w: set.hit,  ans: true,  role: '워밍업' },
    { w: set.miss, ans: false, role: '함정' },
    { w: set.lure, ans: false, role: '핵심' },
  ];

  const s = stage(`
    <div class="headline">기억력 테스트를<br>하나 해보겠습니다 🧠</div>
    ${ment(`"단어 <b>15개</b>가 1초에 하나씩 지나갑니다.<br><b>외우려고 하지 마세요.</b> 그냥 편하게 보기만 하시면 됩니다."`)}
    <div class="caution">💡 "외우세요"라고 하면 효과가 떨어집니다. 꼭 <b>"그냥 보세요"</b>라고 하세요.</div>
    <div class="spacer"></div>
    <button class="bigbtn" id="go">시작 (15초)</button>`);

  s.querySelector('#go').onclick = () => {
    const st = stage(`

/* ═════════ 4. 라이어 ═════════ */
/* 스파이폴형: 라이어에게도 '비슷하지만 다른 단어'를 준다.
   본인도 자기가 라이어인 줄 모르기 때문에 훨씬 웃기고, 지목당해도 덜 무안하다. */
const LIAR_PAIRS = [
  ['떡볶이','라면'], ['지하철','버스'], ['여름','봄'], ['치과','안과'],
  ['고양이','강아지'], ['눈사람','모래성'], ['소풍','수학여행'], ['샤워','목욕'],
  ['커피','녹차'], ['축구','농구'], ['도서관','독서실'], ['라디오','팟캐스트'],
  ['이사','여행'], ['생일','크리스마스'], ['영화관','노래방'], ['빨래','설거지'],
  ['면접','소개팅'], ['우산','모자'], ['편의점','마트'], ['비행기','기차'],
  ['눈물','땀'], ['졸업식','입학식'], ['월요일','일요일'], ['치킨','피자'],
];
const LIAR_TALK = 120;   // 토론 시간(초)
function trickLiar() {
  const s = stage(`
    <div class="headline">라이어를 찾아라 🕵️</div>
    ${ment(`"이 폰을 <b>한 명씩 돌려가며</b> 자기 단어를 확인합니다.<br>딱 한 명만 <b>다른 단어</b>를 받는데 — <b>본인도 모릅니다.</b>"`)}
    <div class="caution">📱 폰을 직접 돌려야 하므로 <b>3~10명</b>일 때 가장 잘 굴러갑니다.</div>
    <div class="subline">몇 명이 함께 하나요?</div>
    <input class="numinput" id="n" type="number" inputmode="numeric" placeholder="예: 6" min="3" max="10">
    <div class="spacer"></div>
    <button class="bigbtn" id="go">시작하기</button>`);

  s.querySelector('#go').onclick = () => {
    const n = parseInt(s.querySelector('#n').value, 10);
    if (!n || n < 3 || n > 10) {
      s.querySelector('#n').value = '';
      s.querySelector('#n').placeholder = '3~10 사이로 입력해주세요';
      s.querySelector('#n').style.borderColor = 'var(--red)';
      vib(60);
      return;
    }
    const pair = LIAR_PAIRS[Math.floor(Math.random() * LIAR_PAIRS.length)];
    const flip = Math.random() < .5;
    const [common, odd] = flip ? [pair[1], pair[0]] : pair;
    const liar = Math.floor(Math.random() * n) + 1;   // 1-based
    const seen = new Set();
    pick();

    function pick() {
      const left = n - seen.size;
      const ps = stage(`
        <div class="headline" style="font-size:19px">자기 번호를 누르세요</div>
        <div class="subline">${left > 0
          ? `아직 <b>${left}명</b>이 확인하지 않았습니다<br>확인한 사람은 폰을 <b>다음 사람에게</b> 넘겨주세요`
          : '전원 확인 완료!'}</div>
        <div class="pgrid">
          ${Array.from({length: n}, (_, i) => {
            const num = i + 1, done = seen.has(num);
            return `<button class="pbtn${done ? ' done' : ''}" data-n="${num}"${done ? ' disabled' : ''}>${num}번</button>`;
          }).join('')}
        </div>
        <div class="spacer"></div>
        ${left === 0 ? '<button class="bigbtn" id="talk">전원 확인 완료 → 토론 시작 🗣️</button>' : ''}`);
      ps.querySelectorAll('.pbtn').forEach(b => b.onclick = () => showWord(+b.dataset.n));
      const t = ps.querySelector('#talk');
      if (t) t.onclick = talk;
    }

    function showWord(num) {
      const sh = stage(`
        <div class="shield">
          <div class="lock">🙈</div>
          <div class="who">${num}번, 준비되셨나요?</div>
          <div class="hint">옆 사람이 화면을 못 보게 가린 뒤<br>아래 버튼을 <b>누르고 있으세요</b><br>손을 떼면 바로 가려집니다</div>
        </div>
        <div class="spacer"></div>
        <button class="bigbtn" id="hold">누르고 있기 👁️</button>`);
      const btn = sh.querySelector('#hold');
      const word = num === liar ? odd : common;
      let shown = false;

      const reveal = e => {
        e.preventDefault();
        if (shown) return;
        shown = true;
        vib(25);
        sh.querySelector('.shield').outerHTML = `
          <div class="liarword">
            <span class="cap">${num}번의 단어</span>
            <span class="w">${word}</span>
          </div>`;
        btn.textContent = '손 떼면 가려집니다';
      };
      let closed = false;
      const hide = () => {
        if (!shown || closed) return;
        closed = true;
        seen.add(num);
        pick();
      };
      btn.addEventListener('touchstart', reveal, { passive: false });
      btn.addEventListener('mousedown', reveal);
      btn.addEventListener('touchend', hide);
      btn.addEventListener('touchcancel', hide);
      btn.addEventListener('mouseup', hide);
      btn.addEventListener('mouseleave', hide);
    }

    function talk() {
      const ts = stage(`
        <div class="headline" style="font-size:19px">토론 시간</div>
        ${ment(`"1번부터 순서대로, 자기 단어에 대해 <b>한 문장씩</b> 설명하세요.<br>단어를 직접 말하면 안 됩니다. <b>너무 정확해도 의심받아요.</b>"`)}
        <div class="bigtimer" id="clk">2:00</div>
        <div class="timerbar"><i id="bar"></i></div>
        <div class="subline">시간이 끝나면 다 같이 <b>하나, 둘, 셋</b>에<br>라이어라고 생각하는 사람을 지목하세요</div>
        <div class="spacer"></div>
        <button class="bigbtn" id="done">투표 끝 → 정답 공개 🔍</button>`);
      let left = LIAR_TALK;
      const clk = ts.querySelector('#clk'), bar = ts.querySelector('#bar');
      const tick = setInterval(() => {
        left--;
        clk.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
        bar.style.width = (left / LIAR_TALK * 100) + '%';
        if (left <= 10) clk.style.color = 'var(--red)';
        if (left <= 0) { clearInterval(tick); vib([120,80,120]); clk.textContent = '0:00'; }
      }, 1000);
      ts.querySelector('#done').onclick = () => { clearInterval(tick); result(); };
    }

    function result() {
      vib([80,60,80,60,180]);
      const rs = stage(`
        <div class="headline">라이어는...</div>
        <div class="revealnum" style="font-size:72px">${liar}번</div>
        <div class="wlist" style="grid-template-columns:repeat(2,1fr)">
          <div class="w" style="padding:14px 4px">나머지 전원<br><b style="font-size:17px;color:var(--neon)">${common}</b></div>
          <div class="w" style="padding:14px 4px">${liar}번만<br><b style="font-size:17px;color:#ffbe73">${odd}</b></div>
        </div>
        ${ment(`"${liar}번, 본인도 몰랐죠? 😏<br>마지막 기회 — <b>나머지 단어가 뭐였을지</b> 맞혀보세요. 맞히면 ${liar}번 승리!"`)}
        <div class="spacer"></div>
        <button class="bigbtn ghost" id="re">새 판 시작</button>`);
      rs.querySelector('#re').onclick = trickLiar;
    }
  };
}

const POINT_QS = [
  { d: '가볍게', q: '지금 제일 배고파 보이는 사람' },
  { d: '가볍게', q: '여기서 제일 늦잠 잘 것 같은 사람' },
  { d: '가볍게', q: '폰 배터리가 제일 없을 것 같은 사람' },
  { d: '가볍게', q: '노래방 가면 마이크 안 놓을 것 같은 사람' },
  { d: '가볍게', q: '집에 가고 싶어 보이는 사람' },
  { d: '가볍게', q: '오늘 제일 멋 내고 온 사람' },
  { d: '가볍게', q: '길치일 것 같은 사람' },

  { d: '한 발 더', q: '싸우면 절대 못 이길 것 같은 사람' },
  { d: '한 발 더', q: '알고 보면 반전 취미가 있을 것 같은 사람' },

  { d: '깊게', q: '오늘 처음 봤는데 또 보고 싶은 사람' },
  { d: '깊게', q: '알고 보면 제일 다정할 것 같은 사람' },
  { d: '깊게', q: '힘들 때 전화하면 받아줄 것 같은 사람' },

  { d: '깊게', q: '생각보다 훨씬 단단해 보이는 사람' },
  { d: '깊게', q: '오늘 제일 고마웠던 사람' },
  { d: '깊게', q: '더 친해지고 싶은 사람' },
  { d: '깊게', q: '이 자리에 없었으면 허전했을 것 같은 사람' },
];
function trickPoint() {
  const deck = ['가볍게', '한 발 더', '깊게'].flatMap(d => shuffle(POINT_QS.filter(x => x.d === d)));
  let qi = 0;

  intro();
  function intro() {
    const s = stage(`
      <div class="headline">동시에 지목 👉</div>
      ${ment(`"제가 질문을 하나 띄울게요. <b>셋을 세면</b> 그 질문에 해당하는 사람을 <b>손가락으로 지목</b>하세요.<br>고민하지 말고 <b>직감</b>대로. 자기 자신도 가능합니다!"`)}
      <div class="subline">4명 이상이면 어디서든 됩니다<br>질문은 갈수록 깊어집니다</div>
      <div class="spacer"></div>
      <button class="bigbtn" id="go">첫 질문 →</button>`);
    s.querySelector('#go').onclick = ask;
  }

  function ask() {
    if (qi >= deck.length) return done();
    const cur = deck[qi];
    const s = stage(`
      <div class="depthrow"><span class="depth">${cur.d} · ${qi + 1} / ${deck.length}</span></div>
      <div class="prompt">${cur.q}</div>
      <div class="spacer"></div>
      <button class="bigbtn" id="go">준비됐으면 → 카운트다운</button>`);
    s.querySelector('#go').onclick = () => count(cur);
  }

  function count(cur) {
    const s = stage(`
      <div class="depthrow"><span class="depth">${cur.d}</span></div>
      <div class="subline" style="margin-top:10px">${cur.q}</div>
      <div class="revealnum" id="c">3</div>
      <div class="spacer"></div>`);
    const c = s.querySelector('#c');
    let v = 3;
    vib(40);
    const t = setInterval(() => {
      v--;
      if (v > 0) {
        c.innerHTML = `<span style="animation:symIn .4s ease backwards">${v}</span>`;
        c.style.animation = 'none';
        vib(40);
        return;
      }
      clearInterval(t);
      vib([120,60,160]);
      shoot(cur);
    }, 900);
  }

  function shoot(cur) {
    const s = stage(`
      <div class="depthrow"><span class="depth">${cur.d}</span></div>
      <div class="lookhand" style="font-size:40px">지목!! 👉</div>
      <div class="subline">${cur.q}</div>
      <div class="headline" style="font-size:18px;margin-top:18px">가장 많이 지목된 사람,<br>30초 해명하세요 🎤</div>
      <div class="bigtimer" id="clk">30</div>
      <div class="timerbar"><i id="bar"></i></div>
      <div class="spacer"></div>
      <div class="btnrow">
        <button class="bigbtn ghost" id="skip">건너뛰기</button>
        <button class="bigbtn" id="nx">다음 질문 →</button>
      </div>`);
    let left = 30;
    const clk = s.querySelector('#clk'), bar = s.querySelector('#bar');
    const t = setInterval(() => {
      left--;
      clk.textContent = left;
      bar.style.width = (left / 30 * 100) + '%';
      if (left <= 5) clk.style.color = 'var(--red)';
      if (left <= 0) { clearInterval(t); vib([100,80,100]); clk.textContent = '끝!'; }
    }, 1000);
    const go = () => { clearInterval(t); qi++; ask(); };
    s.querySelector('#nx').onclick = go;
    s.querySelector('#skip').onclick = go;
  }

  function done() {
    const s = stage(`
      <div class="headline">질문을 다 썼습니다 🎉</div>
      ${ment(`"오늘 제일 많이 지목당한 사람, 오늘의 <b>주인공</b>입니다. 박수!"`)}
      <div class="spacer"></div>
      <button class="bigbtn ghost" id="re">처음부터 다시 (순서가 바뀝니다)</button>`);
    s.querySelector('#re').onclick = trickPoint;
  }
}
