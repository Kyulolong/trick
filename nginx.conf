# 빌드가 없는 단일 HTML 앱을 그대로 서빙한다.
#
# 여기 경로는 전부 루트 기준이다. 앱은 kyulolong.com/trick 에 살지만 Traefik 이
# /trick 프리픽스를 떼고 컨테이너에 넘기기 때문이다. 브라우저가 부르는 /trick/ 은
# index.html 에 손으로 박아둔 슬러그에서 나온다 — 그 둘은 같이 움직여야 한다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # nginx 기본 mime.types 에 .webmanifest 가 없는 버전이 있다. 못을 안 박으면
    # application/octet-stream 으로 나가고 브라우저가 매니페스트를 통째로 무시한다 —
    # 홈 화면에 추가했을 때 이름도 아이콘도 안 붙는 형태로 조용히 실패한다.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # index.html 에 앱 전체가 들어 있다. 캐시하면 배포해도 옛 버전이 계속 나간다.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # 루트에 놓인 정적 파일(아이콘·OG 이미지)은 SPA fallback 에서 뺀다.
    # 없는 파일에 index.html 이 200 으로 돌아가면 실패가 조용해진다 — 카카오가
    # og:image 자리에서 HTML 을 받아 카드가 깨지는데 응답이 200 이라 원인이 안 보인다.
    #
    # 정규식 location 이 prefix 보다 우선하므로 ^/[^/]+ 로 루트 한 칸에만 건다.
    # add_header 를 일부러 안 쓴다 — 하나라도 쓰면 server 의 헤더가 상속에서 빠진다.
    location ~* ^/[^/]+\.(png|svg|ico|webmanifest)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
